# Limite générale des requêtes vers l'API, par adresse IP (en plus des limites du serveur Node)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 4m;

  # En-têtes de sécurité du site (répétés dans /assets/ car nginx n'hérite pas des add_header d'un bloc à l'autre)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # Active HSTS seulement quand le site est servi en HTTPS (ex. derrière un proxy / Cloudflare) :
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # indispensable : sans cela, le serveur croit que tout le monde a la même adresse IP (limites de débit et verrouillages inefficaces)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:5000;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React Router : toute autre URL renvoie index.html
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }
}
